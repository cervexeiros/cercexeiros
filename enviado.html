<script>
// Páxina de volta do respaldo (FormSubmit). Se está dentro do iframe oculto, avisa á páxina do formulario.
(function () {
  var m = /[?&]id=([^&#]+)/.exec(location.search);
  var id = m ? decodeURIComponent(m[1]) : '';
  try { if (window.parent && window.parent !== window) window.parent.postMessage('accp-enviado:' + id, location.origin); } catch (e) {}
})();
</script>
